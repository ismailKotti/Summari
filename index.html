<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summari.AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #cbd5e1 0%, #f1f5f9 50%, #fde68a33 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #1e293b;
    }

    .app-window {
      width: 100%;
      max-width: 1100px;
      background: #f8fafc;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      color: #0f172a;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-size: 0.95rem;
      color: #64748b;
    }

    .nav-links span.active {
      color: #1d4ed8;
      font-weight: 600;
      border-bottom: 2px solid #1d4ed8;
      padding-bottom: 6px;
    }

    /* Main Content Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 24px;
      padding: 28px 32px;
    }

    @media (max-width: 850px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .card-header h2 {
      font-size: 1.35rem;
    }

    /* Controls (Length selector) */
    .controls {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .control-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .segmented {
      display: inline-flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    .segmented button {
      border: none;
      background: transparent;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #475569;
      font-weight: 500;
      transition: 0.2s;
    }

    .segmented button.active {
      background: #dbeafe;
      color: #1e40af;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 270px;
      padding: 16px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      resize: none;
      font-size: 0.98rem;
      line-height: 1.5;
      color: #1e293b;
      outline: none;
      transition: border 0.2s;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }

    .word-counter {
      font-size: 0.85rem;
      color: #64748b;
    }

    .btn-summarize {
      background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
      color: #ffffff;
      border: none;
      padding: 12px 26px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.25);
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn-summarize:hover {
      transform: translateY(-1px);
    }

    .btn-summarize:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Right Panel: Output */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: linear-gradient(90deg, #dbeafe, #fef3c7);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 20px;
    }

    .summary-box {
      flex: 1;
      min-height: 270px;
      line-height: 1.65;
      color: #334155;
      font-size: 0.98rem;
      white-space: pre-wrap;
    }

    .placeholder-text {
      color: #94a3b8;
      font-style: italic;
    }

    .footer-actions {
      display: flex;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      margin-top: 16px;
    }

    .btn-secondary {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #334155;
      font-weight: 500;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="app-window">
    <nav class="navbar">
      <div class="logo">
        <div class="logo-icon"></div>
        <span>Summari.AI</span>
      </div>
    </nav>

    <div class="main-grid">
      <div class="card">
        <div>
          <div class="card-header">
            <h2>Welcome!</h2>
          </div>

          <div class="controls">
            <div class="control-group">
              <label>Length</label>
              <div class="segmented" id="lengthSelector">
                <button type="button" data-min="15" data-max="40">Short</button>
                <button type="button" class="active" data-min="40" data-max="90">Medium</button>
                <button type="button" data-min="90" data-max="160">Long</button>
              </div>
            </div>
          </div>

          <textarea id="inputText" placeholder="Paste or type your text here..."></textarea>
        </div>

        <div class="action-row">
          <span class="word-counter" id="inputWordCount">0 words</span>
          <button class="btn-summarize" id="summarizeBtn" onclick="summarizeText()">
            Summarize ✨
          </button>
        </div>
      </div>

      <!-- Right Column: Output -->
      <div class="card">
        <div>
          <div class="stats-bar">
            <span>Quick Stats</span>
            <span id="reductionStat">Word Count Reduced by 0%</span>
            <span id="summaryCountStat">Summary: 0 words</span>
          </div>

          <h3 style="margin-bottom: 12px;">Your Summary</h3>
          <div class="summary-box" id="summaryOutput">
            <span class="placeholder-text">Your AI-generated summary will appear here...</span>
          </div>
        </div>

        <div class="footer-actions">
          <button class="btn-secondary" onclick="copySummary()">📋 Copy</button>
          <button class="btn-secondary" onclick="downloadSummary()">⬇️ Download .txt</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedMin = 40;
    let selectedMax = 90;

    // Handle Length buttons
    const buttons = document.querySelectorAll('#lengthSelector button');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMin = parseInt(btn.getAttribute('data-min'));
        selectedMax = parseInt(btn.getAttribute('data-max'));
      });
    });

    // Live word count
    const inputText = document.getElementById('inputText');
    const inputWordCount = document.getElementById('inputWordCount');
    inputText.addEventListener('input', () => {
      const words = inputText.value.trim().split(/\s+/).filter(Boolean).length;
      inputWordCount.textContent = `${words} words`;
    });

    async function summarizeText() {
      const text = inputText.value.trim();
      const output = document.getElementById('summaryOutput');
      const btn = document.getElementById('summarizeBtn');

      if (!text) {
        alert("Please paste some text first!");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Summarizing... ⏳";
      output.innerHTML = '<span class="placeholder-text">Generating summary with AI...</span>';

      try {
        const response = await fetch("http://127.0.0.1:8000/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: text,
            min_length: selectedMin,
            max_length: selectedMax
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Server error");
        }

        output.textContent = data.summary;

        // Calculate reduction percentage
        const orig = data.original_word_count || 1;
        const summ = data.summary_word_count || 0;
        const reduction = Math.max(0, Math.round(((orig - summ) / orig) * 100));

        document.getElementById('reductionStat').textContent = `Word Count Reduced by ${reduction}%`;
        document.getElementById('summaryCountStat').textContent = `Summary: ${summ} words`;

      } catch (err) {
        output.innerHTML = `<span style="color: #dc2626;">Error: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Summarize ✨";
      }
    }

    function copySummary() {
      const text = document.getElementById('summaryOutput').innerText;
      navigator.clipboard.writeText(text);
      alert("Summary copied to clipboard!");
    }

    function downloadSummary() {
      const text = document.getElementById('summaryOutput').innerText;
      const blob = new Blob([text], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "summary.txt";
      link.click();
    }
  </script>
</body>
</html>
